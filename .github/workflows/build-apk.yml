name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish APK to GitHub Releases
        if: ${{ success() && github.event_name != 'pull_request' && github.event_name != 'pull_request_target' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          apk_path="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$apk_path"
          release_tag="apk-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$release_tag" "$apk_path" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Мельница — сборка ${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" \
            --notes "APK из сборки ${GITHUB_RUN_NUMBER}, попытка ${GITHUB_RUN_ATTEMPT}. Коммит: ${GITHUB_SHA}."
